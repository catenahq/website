# catenahq/website -- deploy catena.run to GitHub Pages.
#
# Static Astro build (npm run build -> dist/) published to GitHub Pages.
# The custom domain catena.run is set via public/CNAME (persisted on
# deploy). Runs on push to release (the protected deploy branch), and daily
# so a price changed in Polar reaches the site; a merge into main does not
# deploy. The github-pages environment admits release only, and a scheduled
# run starts on the default branch, main, so the daily run starts this
# workflow on release and does nothing else.
#
# @catenahq/contracts is consumed via sibling read (file:../contracts);
# the build checks out catenahq/contracts alongside. contracts is
# public, so no token is needed. The build reads the edition prices from
# Polar with POLAR_PRODUCTS_TOKEN.

name: Deploy to GitHub Pages

on:
  push:
    branches: [release]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

# Least privilege: no permissions by default; each job grants only what
# it needs (zizmor flags workflow-level pages/id-token write as broad).
permissions: {}

# Allow one concurrent deployment; never cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  start-on-release:
    name: start on release
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Start the deploy on release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref release

  build:
    name: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check out website
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: website
          persist-credentials: false
      - name: Check out sibling contracts
        uses: catenahq/contracts/.github/actions/checkout-sibling@ff0e094463a8ae95aaca41ff5e4a5d5fd339bb7e # main
        with:
          repository: catenahq/contracts
          path: contracts
          lock: website/.github/catenahq.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Install
        working-directory: ./website
        run: npm ci
      - name: Build
        working-directory: ./website
        env:
          POLAR_PRODUCTS_TOKEN: ${{ secrets.POLAR_PRODUCTS_TOKEN }}
          PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
